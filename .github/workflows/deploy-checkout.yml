# Deploys the Stripe checkout function to Supabase.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com → Account → Access Tokens
#   STRIPE_SECRET_KEY      — Stripe dashboard → Developers → API keys (sk_test_… or sk_live_…)
# Runs on every change to the function, or by hand from the Actions tab ("Run workflow").
name: Deploy checkout

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
      - .github/workflows/deploy-checkout.yml
  workflow_dispatch:

concurrency: deploy-checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PROJECT_REF: yuyfurkzeomniwynfjyj
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "Stripe is not configured yet (missing secrets) — nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Set Stripe key
        if: steps.check.outputs.ready == 'true'
        run: supabase secrets set --project-ref "$PROJECT_REF" STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
      - name: Deploy function
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy create-checkout --project-ref "$PROJECT_REF" --no-verify-jwt
