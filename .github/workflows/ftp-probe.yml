name: FTP stock probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: List stock files and preview headers
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          LFTP_SET="set net:timeout 20; set net:max-retries 2; set ftp:ssl-allow yes"
          lftp -p "${FTP_PORT:-21}" -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" \
            -e "$LFTP_SET; find -l / | head -n 200; bye" | tee listing.txt
          mkdir -p probe
          grep -E '\.(csv|txt|xml|xlsx?|json)$' listing.txt | awk '{print $NF}' | head -n 5 | while read -r f; do
            lftp -p "${FTP_PORT:-21}" -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" \
              -e "$LFTP_SET; get \"$f\" -o probe/sample; bye" || continue
            echo "===== $f ($(wc -l < probe/sample) lines)"
            head -n 4 probe/sample | cut -c1-400
          done
