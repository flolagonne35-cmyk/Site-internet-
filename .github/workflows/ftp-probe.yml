name: FTP stock probe

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/ftp-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: List stock files and preview headers
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          LFTP_SET="set net:timeout 20; set net:max-retries 2; set ftp:ssl-allow yes"
          lftp -p "${FTP_PORT:-21}" -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" \
            -e "$LFTP_SET; find -l / | head -n 200; bye" | tee listing.txt
          mkdir -p probe
          lftp -p "${FTP_PORT:-21}" -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" \
            -e "$LFTP_SET; set xfer:clobber on; get /odeis_cat_web_stocks.csv -o probe/stock.csv; bye"
          python3 - <<'PY'
          import csv, json, collections
          rows=[r for r in csv.reader(open('probe/stock.csv',encoding='latin-1'),delimiter=';') if r and r[0].strip()]
          print('rows',len(rows),'cols',collections.Counter(len(r) for r in rows))
          for i in (1,3):
              c=collections.Counter(r[i].strip() for r in rows if len(r)>i); print('col',i+1,c.most_common(12))
          q=collections.Counter('neg' if int(r[2] or 0)<0 else ('0' if int(r[2] or 0)==0 else ('1-2' if int(r[2])<3 else '3+')) for r in rows)
          print('qty buckets',q)
          for v in sorted({r[1].strip() for r in rows})[:8]:
              print('sample',v,[r for r in rows if r[1].strip()==v][:3])
          print('col4!=0 sample',[r for r in rows if len(r)>3 and r[3].strip() not in ('','0')][:5])
          cat=json.load(open('data/products.json',encoding='utf-8'))
          refs={p['ref'] for p in cat}; st={r[0].strip() for r in rows}
          print('catalog',len(refs),'in stock file',len(refs&st),'catalog missing from file',len(refs-st),sorted(refs-st)[:25])
          inst=[r for r in rows if r[0].strip() in refs]
          bb=collections.Counter(p['brand'] for p in cat if p['ref'] not in st); print('missing by brand',dict(bb))
          tot=collections.Counter(p['brand'] for p in cat); print('catalog by brand',dict(tot))
          z={r[0].strip() for r in rows if int(r[2] or 0)<=0}; print('qty0 by brand',dict(collections.Counter(p['brand'] for p in cat if p['ref'] in z)))
          lim=[p for p in cat if 'limit' in (p.get('name','')+' '+p.get('desc','')+' '+json.dumps(p.get('specs',{}),ensure_ascii=False)).lower()]
          print('limited',len(lim),'in file',sum(p['ref'] in st for p in lim),'qty0',sum(p['ref'] in z for p in lim),[p['ref'] for p in lim][:10])
          print('catalog qty buckets',collections.Counter('0' if int(r[2] or 0)<=0 else '>0' for r in inst))
          PY
